<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3DClash motion / Integration</title><style>body{font:16px system-ui;color:#11161B;background:#F5F7F8;max-width:920px;margin:48px auto;padding:24px}section{padding:24px;margin:16px 0;background:white}button{font:inherit;padding:10px 16px;margin:12px 8px 0 0}h1{font-size:28px}clash3d-loader{margin-right:24px}.navy{background:#052640;color:white}</style><script type="module" src="3dclash-motion.js"></script><h1>3DClash / Native motion components</h1><section><clash3d-loader label="Loading models" show-label></clash3d-loader><clash3d-loader variant="breathe" label="Preparing model" size="48"></clash3d-loader><clash3d-loader variant="resolve" label="Checking geometry" size="48"></clash3d-loader></section><section><clash3d-phase id="phase" phase="observe" size="48"></clash3d-phase><div><button data-phase="observe">Observe</button><button data-phase="resolve">Resolve</button><button data-phase="check">Check</button><button data-phase="apply">Apply</button></div></section><section class="navy"><clash3d-reveal id="reveal" width="480"></clash3d-reveal><div><button id="replay">Replay reveal</button></div></section><section><clash3d-settle id="complete" size="64" label="Completed"></clash3d-settle><button id="finish">Complete action</button></section><script>document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>document.getElementById('phase').setAttribute('phase',b.dataset.phase));document.getElementById('replay').onclick=()=>document.getElementById('reveal').replay();document.getElementById('finish').onclick=()=>document.getElementById('complete').replay();</script></html>
